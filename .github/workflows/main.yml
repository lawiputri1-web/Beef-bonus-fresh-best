name: Build Beef Bonus Fabric 1.21

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '21'

  - name: Build mod JAR
    uses: gradle/actions/setup-gradle@v4

  - name: Compile Beef Bonus
    run: gradle --no-daemon clean build

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: BeefBonus-Fabric-1.21
      path: build/libs/*.jar
      if-no-files-found: error
